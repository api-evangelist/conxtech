aid: conxtech
name: ConXtech
description: 'ConXtech is a Pleasanton, California structural steel subcontractor that
  designs, fabricates, delivers and erects prefabricated steel building frames for
  commercial construction. Its ConX Systems product line — the XL-400 and XR-200 chassis
  — uses patented collar-and-column connection technology and AISC 358 seismic prequalification
  to erect frames the company reports are three to five times faster than traditional
  steel erection, across healthcare, data center, retail, office, education, high-density
  residential, hospitality, industrial and government projects totalling more than 20
  million square feet. ConXtech is a private company; its equity trades on secondary
  markets. It sells a physical building system, not software, and publishes no public
  developer program, API or machine-readable contract.'
